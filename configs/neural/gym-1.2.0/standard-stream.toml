# Standard-only stream template (baalorlord-standard-v1, Task 6). The Standard learner identity
# (model/features *-standard-v1) declares only Standard raw modes, so the common view is omitted.
# prepare_stream replaces manifest_path, output_root, operation/split/partition and adds
# [scenario_stream]; the manifest named here only lets the template load on its own.
schema = "spire-learn-neural-config-v1"
mode = "standard-standalone"
operation = "train"
split = "train"
partition = "train"
manifest_path = "../../cases/neural/standard-standalone-train.json"
output_root = "../../../artifacts/development/neural-combat/runs/gym-1.2.0/standard-stream"
device = "cpu"

[environment]
