# S1 distillation training config (Task 9): the current FF network, spire-learn-combat-ff-standard-v1,
# with PPO baseline r1's model settings plus three value heads. This file grants no execution authority.
#
# THIS CONFIG IS NOT RUNNABLE UNTIL FILLED. Three values are PLACEHOLDERs and load_distill_config
# refuses the file while any remains (tau and gradient_steps are not numbers; the identity distill
# hash is checked against the authored settings):
#   tau             the MIDDLE tau candidate: the 50th percentile of strictly positive gaps between the
#                   top two distinct teacher values, on the pilot's training rows only, floored at 0.01
#                   (delta 11). It comes from the pilot shards, so it is not known yet.
#   gradient_steps  round(6 * train_rows / batch_rows), fixed once from the S1 pilot (delta 12).
#   config_hashes.distill  distill_config_hash(DistillHyperparameters(...)) of the filled [distill].
# Fill all three together; the model hash below is already final.
schema = "spire-learn-distill-config-v1"
mode = "standard-standalone"
output_root = "../../../artifacts/development/neural-combat/distill/train/s1-pilot"
device = "cuda:0"
seed = 1
eval_every = 1000

[environment]
gym_revision = "731fca0e0341d80e7cf08a8be7a03be1fa32c3f1"
standard_view_layout = "compact"
standard_view_preset = "standard-combat-compact-v1"
standard_view_fingerprint = "49cd162afb9710bc6a27ed78eb6ef6dd84af83ae20317e0fffb106b5963ec3e8"

[model]
embedding_width = 16
hidden_width = 64
max_parameters = 10000000
value_heads = 3

[distill]
tau = "PLACEHOLDER"  # middle tau from the pilot shards (delta 11); refused until a positive number
learning_rate = 0.0003
batch_rows = 512
gradient_steps = "PLACEHOLDER"  # round(6 * train_rows / 512); refused until a positive integer
data_fraction = 1.0

[identity]
model_id = "spire-learn-combat-ff-standard-v1"
features_id = "spire-learn-combat-features-standard-v1"
action_id = "spire-learn-combat-dispatch-v1"
objective_id = "spire-learn-combat-distill-v1"

[identity.accepted_raw_mode_mappings]
standard-standalone = "spire-learn-standard-combat-compact-v1@49cd162afb9710bc6a27ed78eb6ef6dd84af83ae20317e0fffb106b5963ec3e8+gym-1.2.4"

[identity.config_hashes]
model = "70e30870de99753f202861dee764bfd1a27d9c9e1fc216e5ac4db055ebfe33d8"
distill = "PLACEHOLDER"  # distill_config_hash of the filled [distill] table

[runtime]
gpu_uuid = "GPU-c05e0ce3-c1c2-0c54-14e6-8a4a2eccaa1d"
