standard_view_fingerprint = "5d8147e13ded030c7faa501a8202eb2588915c2e1330b30cac5b06afc9f9916e"
workers = 1

[seeds]
policy = 1103
optimizer = 2207
curriculum = 3301
noncombat = 4409

[model]
